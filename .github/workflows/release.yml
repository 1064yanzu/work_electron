name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build-mac-x64:
    runs-on: macos-13
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/

      - name: Build macOS x64
        run: npm run build:mac:x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
          # 用小写 npm_config_* 覆盖 .npmrc 的 npmmirror 镜像（env 优先级高于 project .npmrc，
          # 且这才是 electron-builder 实际读取的键）。CI 走 GitHub 官方源更稳——
          # npmmirror 的 win electron zip 曾下载损坏，导致解压缺 electron.exe、打包 rename 失败。
          npm_config_electron_mirror: https://github.com/electron/electron/releases/download/
          npm_config_electron_builder_binaries_mirror: https://github.com/electron-userland/electron-builder-binaries/releases/download/

      - name: Upload macOS x64 assets
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          shopt -s nullglob
          assets=(release/*/*-x64-Mac.dmg release/*/*-x64-Mac.zip release/*/*-x64-Mac.zip.blockmap)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No macOS x64 assets found"
            exit 1
          fi
          gh release upload "$TAG" "${assets[@]}" --clobber

      - name: Merge macOS update metadata when arm64 assets exist
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="$(node -p "require('./package.json').version")"
          mkdir -p "release/$VERSION"
          gh release download "$TAG" --pattern "*-arm64-Mac.zip" --pattern "*-arm64-Mac.zip.blockmap" --dir "release/$VERSION" || true
          if [ ! -f "release/$VERSION/IPO Workbench-$VERSION-arm64-Mac.zip" ] && [ ! -f "release/$VERSION/IPO-Workbench-$VERSION-arm64-Mac.zip" ]; then
            echo "macOS arm64 zip is not in the Release yet; skip latest-mac.yml merge."
            exit 0
          fi
          npm run generate:latest-mac
          gh release upload "$TAG" "release/$VERSION/latest-mac.yml" --clobber

  build-windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/

      - name: Copy PDF.js assets
        run: node scripts/copy-pdfjs-assets.mjs

      - name: Build for Windows
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
          # 用小写 npm_config_* 覆盖 .npmrc 的 npmmirror 镜像（env 优先级高于 project .npmrc，
          # 且这才是 electron-builder 实际读取的键）。CI 走 GitHub 官方源更稳——
          # npmmirror 的 win electron zip 曾下载损坏，导致解压缺 electron.exe、打包 rename 失败。
          npm_config_electron_mirror: https://github.com/electron/electron/releases/download/
          npm_config_electron_builder_binaries_mirror: https://github.com/electron-userland/electron-builder-binaries/releases/download/

      - name: Smoke check - verify native modules in unpacked asar
        shell: pwsh
        run: |
          $base = "release"
          $unpacked = Get-ChildItem -Path $base -Recurse -Directory -Filter "app.asar.unpacked" | Select-Object -First 1
          if (-not $unpacked) {
            Write-Error "app.asar.unpacked directory not found under release/"
            exit 1
          }
          $root = $unpacked.FullName
          Write-Host "Checking unpacked asar at: $root"
          $checks = @(
            "node_modules\\@img",
            "node_modules\\sharp",
            "node_modules\\node-pty",
            "node_modules\\@anthropic-ai\\claude-agent-sdk-win32-x64\\claude.exe"
          )
          $failed = 0
          foreach ($rel in $checks) {
            $full = Join-Path $root $rel
            if (Test-Path $full) {
              Write-Host "[OK]   $rel"
            } else {
              Write-Warning "[MISS] $rel — NOT found in unpacked asar!"
              $failed++
            }
          }
          if ($failed -gt 0) {
            Write-Error "$failed native module path(s) missing from asar.unpacked. Windows app will crash on launch."
            exit 1
          }
          Write-Host "All native module checks passed."

      # 不需要单独的 Upload 步骤：electron-builder 在 build:win 期间会读取
      # electron-builder.json5 的 publish 配置 + 当前环境的 GH_TOKEN，
      # 自动把 nsis/portable/latest.yml 上传到 GitHub Release。
      # 之前用 softprops/action-gh-release 再上传一次会产生 IPO.Workbench-... 系列
      # 重复 asset（文件名规范化方式不同），与 latest.yml 内的引用对不上。
