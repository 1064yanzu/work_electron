<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Pixel 9 Frame Template</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #f3f3f1;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
    font-family: "Google Sans", "Roboto", system-ui, sans-serif;
  }
  /*
   * Pixel 9
   * Logical viewport: 412 × 892
   * Frame outer: 430 × 910 (incl. 9px bezel)
   */
  .device-pixel-9 {
    position: relative;
    width: 430px; height: 910px;
    border-radius: 44px;
    background: linear-gradient(135deg, #1d1d1d, #2c2c2c);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.05),
      0 20px 60px rgba(0,0,0,0.3);
    padding: 9px;
  }
  .device-pixel-9 .screen {
    position: relative;
    width: 412px; height: 892px;
    border-radius: 36px;
    overflow: hidden;
    background: var(--screen-bg, #ffffff);
  }
  .device-pixel-9 .punch-hole {
    position: absolute;
    top: 12px; left: 50%;
    transform: translateX(-50%);
    width: 14px; height: 14px;
    background: #000;
    border-radius: 50%;
    z-index: 10;
  }
  .device-pixel-9 .status-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 40px;
    padding: 12px 24px 0;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 14px; font-weight: 500;
    color: var(--status-fg, #000);
    z-index: 5;
  }
  .device-pixel-9 .nav-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 36px;
    display: flex; align-items: center; justify-content: center; gap: 80px;
    z-index: 10;
  }
  .device-pixel-9 .nav-pill {
    width: 144px; height: 6px;
    background: var(--nav, #000);
    border-radius: 3px;
  }
  .content {
    position: absolute;
    top: 40px; left: 0; right: 0; bottom: 36px;
    overflow-y: auto;
  }
</style>
</head>
<body>
  <div class="device-pixel-9">
    <div class="screen">
      <div class="punch-hole"></div>
      <div class="status-bar">
        <span class="time">9:41</span>
        <span class="signals">
          <svg width="14" height="10" viewBox="0 0 14 10" fill="currentColor"><path d="M0 8h2v2H0zm4-2h2v4H4zm4-2h2v6H8zm4-4h2v10h-2z"/></svg>
          <svg width="22" height="10" viewBox="0 0 22 10" fill="none" stroke="currentColor" stroke-width="1"><rect x="0.5" y="0.5" width="19" height="9" rx="2"/><rect x="2" y="2" width="15" height="6" fill="currentColor"/><rect x="20" y="3" width="2" height="4" rx="1" fill="currentColor"/></svg>
        </span>
      </div>
      <div class="content">
        <!-- INJECT CONTENT HERE -->
      </div>
      <div class="nav-bar">
        <div class="nav-pill"></div>
      </div>
    </div>
  </div>
</body>
</html>
