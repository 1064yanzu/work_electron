<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>iPhone 15 Pro Frame Template</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #f3f3f1;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, "SF Pro Display", system-ui, sans-serif;
  }
  /*
   * iPhone 15 Pro (Pro Max similar)
   * Logical viewport: 393 × 852
   * Frame outer:      415 × 870 (incl. 11px bezel)
   */
  .device-iphone-15-pro {
    position: relative;
    width: 415px; height: 870px;
    border-radius: 56px;
    background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.05),
      0 20px 60px rgba(0,0,0,0.3);
    padding: 11px;
  }
  .device-iphone-15-pro .screen {
    position: relative;
    width: 393px; height: 852px;
    border-radius: 47px;
    overflow: hidden;
    background: var(--screen-bg, #ffffff);
  }
  .device-iphone-15-pro .dynamic-island {
    position: absolute;
    top: 11px;
    left: 50%;
    transform: translateX(-50%);
    width: 125px; height: 36px;
    background: #000;
    border-radius: 19px;
    z-index: 10;
  }
  .device-iphone-15-pro .status-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 54px;
    padding: 18px 32px 0;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 17px; font-weight: 600;
    color: var(--status-fg, #000);
    z-index: 5;
  }
  .device-iphone-15-pro .home-indicator {
    position: absolute;
    bottom: 8px; left: 50%;
    transform: translateX(-50%);
    width: 134px; height: 5px;
    background: var(--indicator, #000);
    border-radius: 3px;
    z-index: 10;
  }
  .signals svg { vertical-align: middle; margin-left: 4px; }
  /* slot for content */
  .content {
    position: absolute;
    top: 54px; left: 0; right: 0; bottom: 34px;
    overflow-y: auto;
  }
</style>
</head>
<body>
  <div class="device-iphone-15-pro">
    <div class="screen">
      <div class="dynamic-island"></div>
      <div class="status-bar">
        <span class="time">9:41</span>
        <span class="signals">
          <!-- 5G + signal + battery, monochrome SVGs -->
          <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4"/><rect x="5" y="5" width="3" height="7"/><rect x="10" y="2" width="3" height="10"/><rect x="15" y="0" width="3" height="12"/></svg>
          <svg width="26" height="12" viewBox="0 0 26 12" fill="none" stroke="currentColor" stroke-width="1"><rect x="0.5" y="0.5" width="22" height="11" rx="2"/><rect x="2" y="2" width="18" height="8" fill="currentColor"/><rect x="23" y="3.5" width="2" height="5" rx="1" fill="currentColor"/></svg>
        </span>
      </div>
      <div class="content">
        <!-- INJECT CONTENT HERE -->
      </div>
      <div class="home-indicator"></div>
    </div>
  </div>
</body>
</html>
