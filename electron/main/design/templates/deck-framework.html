<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8" />
<title>Deck Framework — IPO Workbench</title>
<style>
  :root {
    --bg: #f7f3ee;
    --fg: #1a1a19;
    --accent: #d96c46;
    --muted: #7c7c75;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    height: 100vh;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: "Inter", system-ui, sans-serif;
    user-select: none;
  }
  .deck {
    position: relative;
    width: 100vw; height: 100vh;
  }
  .slide {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    justify-content: center;
    padding: 6vw 8vw;
    animation: slideFade 0.45s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .slide.active { display: flex; }
  .slide h1 {
    font-size: clamp(48px, 7.5vw, 120px);
    line-height: 1.05;
    font-weight: 700;
    margin: 0 0 0.4em;
    letter-spacing: -0.02em;
  }
  .slide h2 {
    font-size: clamp(32px, 5vw, 80px);
    line-height: 1.1;
    font-weight: 600;
    margin: 0 0 0.5em;
    letter-spacing: -0.01em;
  }
  .slide p {
    font-size: clamp(18px, 2.5vw, 36px);
    line-height: 1.45;
    margin: 0 0 1em;
    color: var(--muted);
  }
  .slide .accent { color: var(--accent); }
  .slide .meta {
    position: absolute;
    top: 4vw; left: 8vw;
    font-size: 1vw;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--muted);
  }
  .slide .footnote {
    position: absolute;
    bottom: 4vw; left: 8vw;
    font-size: 1.2vw;
    color: var(--muted);
  }
  @keyframes slideFade {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .deck-progress {
    position: fixed;
    top: 0; left: 0;
    height: 3px;
    background: var(--accent);
    transition: width 0.4s ease;
    z-index: 100;
  }
  .deck-counter {
    position: fixed;
    bottom: 24px; right: 32px;
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    opacity: 0.7;
    z-index: 100;
  }
  .deck-help {
    position: fixed;
    bottom: 24px; left: 32px;
    font-size: 11px;
    color: var(--muted);
    opacity: 0.4;
    z-index: 100;
  }
</style>
</head>
<body>
  <div class="deck">
    <!-- ↓↓↓ FILL SLIDES BELOW ↓↓↓ -->

    <section class="slide active" data-index="1">
      <div class="meta">Slide 1 · Hero</div>
      <h1>Title goes here</h1>
      <p>Subtitle / pitch goes here.</p>
      <div class="footnote">{{ team / date }}</div>
    </section>

    <section class="slide" data-index="2">
      <div class="meta">Slide 2 · Problem</div>
      <h2>The problem</h2>
      <p>One-sentence framing of the pain.</p>
    </section>

    <section class="slide" data-index="3">
      <div class="meta">Slide 3 · Solution</div>
      <h2>The solution</h2>
      <p>One-sentence framing of the answer.</p>
    </section>

    <!-- ↑↑↑ FILL SLIDES ABOVE ↑↑↑ -->
  </div>

  <div class="deck-progress" id="progress"></div>
  <div class="deck-counter">
    <span id="cur">1</span> / <span id="total"></span>
  </div>
  <div class="deck-help">← / → · Space · Esc to exit</div>

  <script>
    const slides = document.querySelectorAll('.slide');
    const progress = document.getElementById('progress');
    let idx = 0;
    document.getElementById('total').textContent = slides.length;

    function go(next) {
      if (slides.length === 0) return;
      slides[idx].classList.remove('active');
      idx = Math.max(0, Math.min(slides.length - 1, next));
      slides[idx].classList.add('active');
      document.getElementById('cur').textContent = idx + 1;
      progress.style.width = `${((idx + 1) / slides.length) * 100}%`;
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        e.preventDefault();
        go(idx + 1);
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        go(idx - 1);
      } else if (e.key === 'Home') {
        e.preventDefault();
        go(0);
      } else if (e.key === 'End') {
        e.preventDefault();
        go(slides.length - 1);
      } else if (e.key === 'f' || e.key === 'F') {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen();
        } else {
          document.exitFullscreen();
        }
      }
    });

    document.addEventListener('click', (e) => {
      const rect = document.body.getBoundingClientRect();
      const x = e.clientX - rect.left;
      if (x > rect.width / 2) go(idx + 1); else go(idx - 1);
    });

    go(0);
  </script>
</body>
</html>
